name: Android CI

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'website/**'
      - 'docs/**'
      - '**.md'
  push:
    branches:
      - main
    paths-ignore:
      - 'website/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Unit tests and debug build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Must match JavaVersion.VERSION_17 / jvmTarget '17' in app/build.gradle.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Only main writes the cache, so pull requests share one warm cache
      # instead of each seeding its own.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Pre-warm Compose BOM 2025.08.00 resolution cache (main branch only)
      - name: Warm Compose BOM cache
        if: github.ref == 'refs/heads/main'
        run: |
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath \
            --no-daemon  # Run ONLINE to populate cache; offline fails on cold cache

      # Verify critical Compose artifacts exist in cache (diagnostic only)
      - name: Verify Compose BOM artifacts cached
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          ls -la ~/.gradle/caches/modules-2/files-2.1/androidx.compose.foundation/foundation/ 2>/dev/null || echo "foundation not cached yet"
          ls -la ~/.gradle/caches/modules-2/files-2.1/androidx.compose.ui/ui-util/ 2>/dev/null || echo "ui-util not cached yet"
          ls -la ~/.gradle/caches/modules-2/files-2.1/androidx.activity/activity-compose/ 2>/dev/null || echo "activity-compose not cached yet"

      - name: Run unit tests and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

  lint:
    name: Android Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Pre-warm Compose BOM 2025.08.00 resolution cache (main branch only)
      - name: Warm Compose BOM cache
        if: github.ref == 'refs/heads/main'
        run: |
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath \
            --no-daemon  # Run ONLINE to populate cache; offline fails on cold cache

      # Verify critical Compose artifacts exist in cache (diagnostic only)
      - name: Verify Compose BOM artifacts cached
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          ls -la ~/.gradle/caches/modules-2/files-2.1/androidx.compose.foundation/foundation/ 2>/dev/null || echo "foundation not cached yet"
          ls -la ~/.gradle/caches/modules-2/files-2.1/androidx.compose.ui/ui-util/ 2>/dev/null || echo "ui-util not cached yet"
          ls -la ~/.gradle/caches/modules-2/files-2.1/androidx.activity/activity-compose/ 2>/dev/null || echo "activity-compose not cached yet"

      # Pre-existing findings live in app/lint-baseline.xml; only new
      # findings fail this step.
      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --stacktrace --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.txt
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 14

  instrumented-tests:
    name: Instrumented tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # minSdk and targetSdk from app/build.gradle - keep in sync.
        api-level: [26, 36]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Pre-warm Compose BOM 2025.08.00 resolution cache (main branch only)
      - name: Warm Compose BOM cache
        if: github.ref == 'refs/heads/main'
        run: |
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath \
            --no-daemon  # Run ONLINE to populate cache; offline fails on cold cache

      # Verify critical Compose artifacts exist in cache (diagnostic only)
      - name: Verify Compose BOM artifacts cached
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          ls -la ~/.gradle/caches/modules-2/files-2.1/androidx.compose.foundation/foundation/ 2>/dev/null || echo "foundation not cached yet"
          ls -la ~/.gradle/caches/modules-2/files-2.1/androidx.compose.ui/ui-util/ 2>/dev/null || echo "ui-util not cached yet"
          ls -la ~/.gradle/caches/modules-2/files-2.1/androidx.activity/activity-compose/ 2>/dev/null || echo "activity-compose not cached yet"

      # GitHub-hosted Linux runners don't grant /dev/kvm access by default;
      # without it the emulator falls back to (much slower, often timing-out)
      # software rendering.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Runs the whole androidTest source set - not a hand-picked class list,
      # so new instrumentation tests (e.g. #104's real-Keystore cipher test)
      # are picked up automatically.
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: ${{ matrix.api-level >= 30 && 'google_apis' || 'default' }}
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports-api${{ matrix.api-level }}
          path: app/build/reports/androidTests/connected/
          if-no-files-found: ignore
          retention-days: 14

  release-build:
    name: Unsigned release build (R8/ProGuard)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Pre-warm Compose BOM 2025.08.00 resolution cache (main branch only)
      - name: Warm Compose BOM cache
        if: github.ref == 'refs/heads/main'
        run: |
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath \
            --no-daemon  # Run ONLINE to populate cache; offline fails on cold cache

      # Verify critical Compose artifacts exist in cache (diagnostic only)
      - name: Verify Compose BOM artifacts cached
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          ls -la ~/.gradle/caches/modules-2/files-2.1/androidx.compose.foundation/foundation/ 2>/dev/null || echo "foundation not cached yet"
          ls -la ~/.gradle/caches/modules-2/files-2.1/androidx.compose.ui/ui-util/ 2>/dev/null || echo "ui-util not cached yet"
          ls -la ~/.gradle/caches/modules-2/files-2.1/androidx.activity/activity-compose/ 2>/dev/null || echo "activity-compose not cached yet"

      # No signing secrets in CI. -PallowUnsignedRelease builds an unsigned,
      # uninstallable APK purely to exercise R8/ProGuard, which debug builds
      # never touch; a plain assembleRelease still refuses to run unsigned.
      - name: Build unsigned release APK
        run: ./gradlew :app:assembleRelease -PallowUnsignedRelease --stacktrace --no-daemon

      # If R8 ever does strip something reflection needs, the minified APK is
      # what gets inspected (apkanalyzer/aapt) to see which class went missing.
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
