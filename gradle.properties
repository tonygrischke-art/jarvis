# Project-wide Gradle settings.
#
# This file is tracked in Git. The project cannot build without the settings
# below, so they cannot live in an untracked file.
#
# NEVER put signing credentials here. See gradle.properties.example for where
# those go.

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true

android.useAndroidX=true
kotlin.code.style=official

# Kotlin daemon reuse across CI runs
kotlin.daemon.jvm.options=-Xmx2g

# AGP 9.1+ JVM target alignment
android.nonTransitiveRClass=true

# KSP incremental processing
ksp.incremental=true
ksp.incremental.interop=true

# Network timeout for dependency resolution (CI)
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=180000

# Cache invalidation for CI — bump this version when you want to force fresh dependency resolution
# gradle.cache.version=1
